[package]
name = "uniffi-fixture-ext-types-proc-macro"
edition = "2021"
version = "0.22.0"
license = "MPL-2.0"
publish = false

[package.metadata.uniffi.testing]
external-crates = [
    "uniffi-fixture-ext-types-custom-types",
    "uniffi-fixture-ext-types-lib-one",
    "uniffi-example-custom-types",
]

[lib]
crate-type = [
    "lib",
    "cdylib",
]
name = "uniffi_ext_types_proc_macro_lib"

[dependencies]
anyhow = "1"
bytes = "1.11"
url = "2.2"

[dependencies.uniffi]
workspace = true

[dependencies.uniffi-fixture-ext-types-lib-one]
path = "../uniffi-one"

[dependencies.uniffi-fixture-ext-types-custom-types]
path = "../custom-types"

[dependencies.uniffi-example-custom-types]
path = "../../examples/custom-types"

[build-dependencies.uniffi]
workspace = true
features = ["build"]
