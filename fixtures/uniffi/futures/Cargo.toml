[package]
name = "uniffi-fixture-futures"
version = "0.21.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
name = "uniffi_futures"
crate-type = [
    "lib",
    "cdylib",
]

[dependencies]
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
once_cell = "1.18.0"

[dependencies.uniffi]
workspace = true
features = [
    "tokio",
    "cli",
    "scaffolding-ffi-buffer-fns",
]

[dependencies.tokio]
version = "1.38.2"
features = [
    "time",
    "sync",
]

[build-dependencies.uniffi]
workspace = true
features = [
    "build",
    "scaffolding-ffi-buffer-fns",
]
