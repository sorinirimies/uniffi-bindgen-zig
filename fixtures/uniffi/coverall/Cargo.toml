[package]
name = "uniffi-fixture-coverall"
version = "0.22.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = [
    "lib",
    "cdylib",
]
name = "uniffi_coverall"

[dependencies]
once_cell = "1.12"
thiserror = "2"

[dependencies.uniffi]
workspace = true
features = ["scaffolding-ffi-buffer-fns"]

[build-dependencies.uniffi]
workspace = true
features = ["build"]
