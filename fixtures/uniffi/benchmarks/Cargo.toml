[package]
name = "uniffi-fixture-benchmarks"
edition = "2021"
version = "0.22.0"
license = "MPL-2.0"
publish = false

[lib]
crate-type = [
    "lib",
    "cdylib",
]
name = "uniffi_benchmarks"
bench = false

[dependencies]
anyhow = "1"
camino = "1"
criterion = "0.5.1"
indexmap = "2"
regex = "1.5.1"
serde_json = "1"
thiserror = "2"

[dependencies.uniffi]
workspace = true

[dependencies.clap]
version = "4"
features = [
    "cargo",
    "std",
    "derive",
]
