[package]
name = "uniffi-example-arithmetic"
edition = "2021"
version = "0.22.0"
license = "MPL-2.0"
publish = false

[lib]
crate-type = [
    "lib",
    "cdylib",
]
name = "arithmetical"

[dependencies]
thiserror = "2"

[dependencies.uniffi]
workspace = true
features = ["scaffolding-ffi-buffer-fns"]

[build-dependencies.uniffi]
workspace = true
features = [
    "build",
    "scaffolding-ffi-buffer-fns",
]
