[package]
name = "uniffi-example-async-api-client"
edition = "2021"
version = "0.26.1"
license = "MPL-2.0"
publish = false

[lib]
crate-type = [
    "lib",
    "cdylib",
]
name = "uniffi_async_api_client"

[dependencies]
async-trait = "0.1"
serde_json = "1"
thiserror = "2"

[dependencies.uniffi]
workspace = true

[dependencies.serde]
version = "1"
features = ["derive"]

[build-dependencies.uniffi]
workspace = true
features = ["build"]
